<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="76" viewBox="0 0 480 76" role="img" aria-labelledby="t d">
<title id="t">Portfolio: fadii-99.github.io</title>
<desc id="d">Link card — Portfolio: fadii-99.github.io</desc>
<defs>
  <linearGradient id="k-hair" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".75"/>
    <stop offset=".5" stop-color="#3b82f6" stop-opacity=".35"/>
    <stop offset="1" stop-color="#34d399" stop-opacity=".7"/>
  </linearGradient>
  <linearGradient id="k-glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1424"/>
    <stop offset="1" stop-color="#0a0f1a"/>
  </linearGradient>
  <pattern id="k-dots" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".055"/>
  </pattern>
  <filter id="k-blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="48"/>
  </filter>
  <filter id="k-glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
@font-face{font-family:'FwDisplay';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'FwDisplay';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'FwMono';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'FwMono';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}

text { font-family: 'FwDisplay','Space Grotesk','Segoe UI',sans-serif; }
.mono { font-family: 'FwMono','JetBrains Mono',ui-monospace,monospace; }
.aur0 { animation: drift0 14s ease-in-out infinite alternate; }
.aur1 { animation: drift1 18s ease-in-out infinite alternate; }
@keyframes drift0 { from { transform: translate(0,0); } to { transform: translate(-40px, 24px); } }
@keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(36px, -20px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }


.nudge { animation: nudge 1.6s ease-in-out infinite both; }
@keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }

</style>

<rect x=".75" y=".75" width="478.5" height="74.5" rx="16" fill="url(#k-glass)"/><rect x=".75" y=".75" width="478.5" height="74.5" rx="16" fill="url(#k-dots)"/>
<rect x=".75" y=".75" width="478.5" height="74.5" rx="16" fill="none" stroke="url(#k-hair)" stroke-opacity="1" stroke-width="1.2"/>
<rect x="16" y="16" width="44" height="44" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".35"/>
<circle cx="38" cy="38" r="10" fill="none" stroke="#22d3ee" stroke-width="1.7"/><ellipse cx="38" cy="38" rx="4.5" ry="10" fill="none" stroke="#22d3ee" stroke-width="1.5"/><path d="M28 38 H48" stroke="#22d3ee" stroke-width="1.5"/>
<text x="76" y="34" font-size="16" font-weight="500" fill="#e6edf3">Portfolio</text>
<text class="mono" x="76" y="53" font-size="11.5" fill="#9aa7b8">fadii-99.github.io</text>
<g class="nudge">
  <path d="M436 38 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
